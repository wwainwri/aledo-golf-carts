<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="Illustration of an all-terrain golf cart tyre showing the tread pattern">
  <title>All-terrain golf cart tyre</title>
  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.34" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2ece4"/>
      <stop offset="1" stop-color="#ded5c9"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(23,21,18,0.34)"/>
      <stop offset="1" stop-color="rgba(23,21,18,0)"/>
    </radialGradient>

    <!-- Rubber. Lit from the upper left, falling away to the lower right. -->
    <linearGradient id="rubber" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5a626a"/>
      <stop offset="0.3" stop-color="#3b4148"/>
      <stop offset="0.72" stop-color="#242930"/>
      <stop offset="1" stop-color="#171b1f"/>
    </linearGradient>
    <linearGradient id="tread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#484f57"/>
      <stop offset="0.45" stop-color="#2c3239"/>
      <stop offset="1" stop-color="#1a1e23"/>
    </linearGradient>
    <linearGradient id="sidewall" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#31363b"/>
      <stop offset="0.45" stop-color="#1e2226"/>
      <stop offset="1" stop-color="#101213"/>
    </linearGradient>
    
    <radialGradient id="barrel" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#0a0b0c"/>
      <stop offset="0.65" stop-color="#15181a"/>
      <stop offset="1" stop-color="#22262a"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="529" rx="286" ry="30" fill="url(#pool)"/>

  <!-- Far rim -->
  <ellipse cx="462.0" cy="302.0" rx="166" ry="242" fill="#0a0b0c"/>

  <!-- Tread band across the middle -->
  <clipPath id="bandClip"><path d="M 322.0 50.0 A 166 242 0 0 1 322.0 534.0 L 462.0 544.0 A 166 242 0 0 0 462.0 60.0 Z"/></clipPath>
  <path d="M 322.0 50.0 A 166 242 0 0 1 322.0 534.0 L 462.0 544.0 A 166 242 0 0 0 462.0 60.0 Z" fill="url(#tread)"/>

  <!-- Blocks, clipped to the band, with a circumferential groove down the
       centre — which is what an all-terrain tread looks like, rather than
       one row of teeth. -->
  <g clip-path="url(#bandClip)">
    <line x1="326.0" y1="50.3" x2="458.0" y2="59.7" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="343.3" y1="51.6" x2="475.4" y2="61.0" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="360.5" y1="55.6" x2="492.5" y2="65.0" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="377.3" y1="62.1" x2="509.3" y2="71.6" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="393.5" y1="71.2" x2="525.5" y2="80.6" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="409.0" y1="82.7" x2="541.0" y2="92.1" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="423.6" y1="96.5" x2="555.6" y2="105.9" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="437.1" y1="112.4" x2="569.1" y2="121.9" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="449.4" y1="130.4" x2="581.4" y2="139.8" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="460.3" y1="150.0" x2="592.3" y2="159.5" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="469.8" y1="171.3" x2="601.8" y2="180.7" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="477.6" y1="193.9" x2="609.7" y2="203.3" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="483.9" y1="217.5" x2="615.9" y2="226.9" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="488.4" y1="242.0" x2="620.4" y2="251.4" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="491.1" y1="267.0" x2="623.1" y2="276.4" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="492.0" y1="292.3" x2="624.0" y2="301.7" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="491.1" y1="317.6" x2="623.1" y2="327.0" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="488.4" y1="342.6" x2="620.4" y2="352.0" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="483.9" y1="367.1" x2="615.9" y2="376.5" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="477.6" y1="390.7" x2="609.7" y2="400.1" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="469.8" y1="413.3" x2="601.8" y2="422.7" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="460.3" y1="434.5" x2="592.3" y2="444.0" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="449.4" y1="454.2" x2="581.4" y2="463.6" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="437.1" y1="472.1" x2="569.1" y2="481.6" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="423.6" y1="488.1" x2="555.6" y2="497.5" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="409.0" y1="501.9" x2="541.0" y2="511.3" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="393.5" y1="513.4" x2="525.5" y2="522.8" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="377.3" y1="522.4" x2="509.3" y2="531.9" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="360.5" y1="529.0" x2="492.5" y2="538.4" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <line x1="343.3" y1="533.0" x2="475.4" y2="542.4" stroke="#0b0e11" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <line x1="326.0" y1="534.3" x2="458.0" y2="543.7" stroke="#0b0e11" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
    <path d="M 392.0 55.0 A 166 242 0 0 1 392.0 539.0"
          fill="none" stroke="#3d444b" stroke-width="9" opacity="0.75"/>
  </g>
  <path d="M 322.0 50.0 A 166 242 0 0 1 322.0 534.0 L 462.0 544.0 A 166 242 0 0 0 462.0 60.0 Z" fill="none" stroke="#0b0e11" stroke-width="3"/>

  <!-- Near sidewall -->
  <ellipse cx="322" cy="292" rx="166" ry="242" fill="url(#rubber)"/>
  <ellipse cx="322" cy="292" rx="166" ry="242" fill="none" stroke="#07080a" stroke-width="3"/>
  <ellipse cx="322" cy="292" rx="148.0" ry="216.0" fill="none" stroke="#000" stroke-width="3" opacity="0.5"/>

  <!-- Raised lettering, suggested rather than spelled out -->
  <g opacity="0.42" stroke="#949ba2" stroke-width="3.4" stroke-linecap="round">
    <path d="M 204.0 366.0 l 26 -10"/>
    <path d="M 214.0 392.0 l 34 -13"/>
    <path d="M 230.0 416.0 l 22 -9"/>
  </g>

  <!-- The barrel, seen through the bead -->
  <ellipse cx="322" cy="292" rx="112" ry="172" fill="url(#barrel)"/>
  <ellipse cx="322" cy="292" rx="112" ry="172" fill="none" stroke="#050607" stroke-width="4"/>
  <!-- Inner wall catching a little light on the far side -->
  <path d="M 342.0 136.0 A 98.0 158.0 0 0 1 342.0 448.0"
        fill="none" stroke="#2e3438" stroke-width="16" opacity="0.7"/>
  <!-- Bead seat -->
  <ellipse cx="322" cy="292" rx="124.0" ry="188.0" fill="none" stroke="#3a4045" stroke-width="4" opacity="0.5"/>

  <!-- Specular sweep -->
  <path d="M 199.2 180.7
           A 166 242 0 0 1 332.0 59.7"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="10" stroke-linecap="round"/>
</svg>
